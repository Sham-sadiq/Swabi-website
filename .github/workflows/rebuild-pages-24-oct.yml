# One-off: rebuilds the GitHub Pages site on 24 Oct 2026 so the post dated 07:30 that day goes live before 8am.
# Jekyll hides future-dated posts until the next build. Two runs in case GitHub delays the first.
# Safe to delete after 24 Oct 2026.
name: Rebuild Pages (24 Oct 2026)
on:
  schedule:
    - cron: "35 6 24 10 *"   # 07:35 UK time (BST)
    - cron: "55 6 24 10 *"   # 07:55 UK time, backup
  workflow_dispatch:
permissions:
  pages: write
  contents: read
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Pages build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
