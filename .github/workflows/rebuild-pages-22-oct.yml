# One-off: rebuilds the GitHub Pages site on 22 Oct 2026 so the post dated that day goes live.
# Jekyll hides future-dated posts until the next build. Safe to delete after 22 Oct 2026.
name: Rebuild Pages (22 Oct 2026)
on:
  schedule:
    - cron: "5 7 22 10 *"
  workflow_dispatch:
permissions:
  pages: write
  contents: read
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Pages build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
